# A2A-Agenten mit Weboberfläche auf einem Server ohne GPU.
#
#   docker compose up -d        starten
#   docker compose logs -f      beim Hochfahren zusehen
#   docker compose down         stoppen
#
# Danach: http://<server>:9999/
#
# Der erste Start dauert einige Minuten, weil das Sprachmodell (~3 GB)
# heruntergeladen wird. Es landet im Volume `hf-cache` und wird danach
# wiederverwendet – auch über `docker compose down` hinaus.

# `version` ist für Compose v2 überflüssig (es zeigt dafür einen Hinweis an),
# das alte docker-compose v1 braucht den Schlüssel aber: Ohne ihn liest v1 die
# Datei im Uralt-Format und meldet Fehler in einem "Service namens services".
version: "2.4"

services:
  a2a:
    image: ghcr.io/marcofranke/agentexample:latest
    # Zum lokalen Bauen statt Ziehen die nächste Zeile einkommentieren:
    # build: .
    container_name: a2a-agents
    restart: unless-stopped

    ports:
      - "9999:9999"

    # Compose legt sonst ein eigenes Netz an. Auf Servern, auf denen schon viele
    # Compose-Projekte laufen, gehen Docker irgendwann die privaten Adressbereiche
    # aus ("could not find an available, non-overlapping IPv4 address pool").
    # Dann hilft `docker network prune` – oder die nächste Zeile: Der Container
    # hängt sich an die vorhandene Standard-Bridge, ein neues Netz entfällt.
    # Für diesen Stack aus genau einem Dienst ist das unbedenklich.
    # network_mode: "bridge"

    # Listenform statt Zuordnung: Ein Eintrag ohne "=" reicht die Variable vom
    # Host durch, falls sie dort gesetzt ist, und sonst gar nicht. Das kommt
    # ohne `${VAR:-}` aus – diese Schreibweise mit leerem Vorgabewert lehnt
    # docker-compose v1 mit "Invalid interpolation format" ab.
    environment:
      # Im Container muss auf allen Adressen gelauscht werden, sonst kommt von
      # außen nichts an. BASE_URL bleibt intern: Unter dieser Adresse ruft der
      # Orchestrator die Agenten im selben Container auf.
      - A2A_HOST=0.0.0.0
      - A2A_PORT=9999
      - A2A_BASE_URL=http://127.0.0.1:9999

      # CPU-Betrieb: bfloat16 halbiert den Speicherbedarf des Modells von rund
      # 6 GB auf rund 3 GB. Auf sehr alten CPUs ist float32 schneller.
      - LLM_DTYPE=bfloat16
      # - LLM_MODEL=Qwen/Qwen2.5-1.5B-Instruct

      # Server ohne Internetzugang: Modell vorab auf einem Rechner MIT Internet
      # holen, den Ordner hierher kopieren und die beiden nächsten Zeilen sowie
      # die passende Zeile unter `volumes:` einkommentieren. Dann wird nichts
      # mehr nachgeladen.
      #   huggingface-cli download Qwen/Qwen2.5-1.5B-Instruct --local-dir modell
      # - LLM_MODEL=/modell
      # - HF_HUB_OFFLINE=1

      # Thread-Zahl an die vorhandenen Kerne anpassen. Ohne Begrenzung belegt
      # torch alle Kerne, was auf einem geteilten Server unschön ist.
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4

      # Der Research-Agent baut sein Gedächtnis sonst beim Start neu auf und
      # lädt dabei von der BIBA-Webseite, OpenAlex und Google Scholar. Das
      # mitgelieferte Gedächtnis reicht zum Ausprobieren.
      - RESEARCH_INDEX_AT_STARTUP=0
      # - RESEARCH_MAX_STAFF=10
      # - RESEARCH_SOURCE=openalex

      # Die folgenden drei werden nur durchgereicht, wenn sie im Terminal
      # gesetzt sind, aus dem heraus `docker compose up` läuft. Kein Token
      # hier eintragen – sonst steht es im Repo.
      # HF_TOKEN nur für gated Modelle auf Hugging Face nötig,
      # SEMANTIC_MEDIATOR_* nur, wenn Agent H an eine echte Instanz soll.
      - HF_TOKEN
      - SEMANTIC_MEDIATOR_URL
      - SEMANTIC_MEDIATOR_TOKEN

    volumes:
      # Modell-Download einmalig aufheben.
      - hf-cache:/cache/huggingface
      # Gedächtnis des Research-Agenten über Neustarts hinweg behalten. Beim
      # ersten Start füllt Docker das Volume mit dem Stand aus dem Image.
      - research-memory:/app/memory
      # PDFs, die der Research-Agent zieht.
      - research-downloads:/app/downloads
      # Vorab heruntergeladenes Modell für Server ohne Internet (siehe oben).
      # - ./modell:/modell:ro

    # Das Modell braucht Arbeitsspeicher: rund 3 GB mit bfloat16, rund 6 GB mit
    # float32, dazu etwas für Python und die Agenten. Unter 4 GB wird es eng.
    # `mem_limit`/`mem_reservation` statt `deploy.resources` – Letzteres wirkt
    # in docker-compose v1 nicht und wird dort nur mit einer Warnung übergangen.
    mem_limit: 6g
    mem_reservation: 4g

volumes:
  hf-cache:
  research-memory:
  research-downloads:
