# Wrapper-Konfiguration der Beispiel-Datenquelle (CSV mit Sensormesswerten).
#
# Alle Pfade absolut: Der Mediator startet mit Arbeitsverzeichnis "/", relative
# Angaben wuerden dort gesucht. Im Container liegt dieser Ordner unter /config.
HasHeadings=true
Delimiter=,
Filename=/config/SCADA/example_data.csv
MappingFile=/config/SCADA/mapping.xml
MappingSchema=/config/SCADA/TableMapping.xsd
OntologyFile=/config/SCADA/ontology.owl
DatatypeDefinitionFile=/config/SCADA/datatypes.txt
DateFormat=dd-MMM-yy
